<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎸 합주곡 추천 & 세션 모집</title>
<style>
  :root{
    --pink:#ff8fab; --purple:#a78bfa; --blue:#60a5fa; --green:#22c55e;
    --red:#f87171; --gray:#9ca3af; --bg-outer:#eef0f6; --card:#ffffff;
    --border:#eee0f5; --muted:#9096a8; --text:#2f2b3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Pretendard','Segoe UI','Malgun Gothic',sans-serif;
    background:var(--bg-outer); color:var(--text);
    display:flex; justify-content:center; padding:18px 8px;
  }
  .phone-frame{
    width:100%; max-width:430px; background:linear-gradient(180deg,#fff7fb,#f6f5ff);
    border:9px solid #2c2a3a; border-radius:38px; box-shadow:0 14px 30px rgba(0,0,0,.18);
    overflow:hidden; position:relative;
  }
  .phone-notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:110px; height:20px; background:#2c2a3a; border-radius:0 0 14px 14px; z-index:5;
  }
  .phone-inner{
    max-height:92vh; overflow-y:auto; padding:34px 14px 24px;
  }
  h1{
    text-align:center; font-size:1.35rem; margin:0 0 2px; font-weight:800;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{text-align:center;color:var(--muted);font-size:.75rem;margin-bottom:14px;}

  .profile-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:9px 14px; margin-bottom:14px; font-size:.8rem;
  }
  .profile-bar .who{font-weight:700;color:#6d28d9;}
  .profile-bar button{
    border:none; background:#f3e8ff; color:#7c3aed; padding:6px 10px; border-radius:20px;
    font-size:.72rem; font-weight:600; cursor:pointer;
  }

  .form-card{
    background:#fff; border:1px solid var(--border); border-radius:18px;
    padding:16px; margin-bottom:18px; box-shadow:0 3px 10px rgba(150,100,200,.06);
  }
  .form-card h2{margin:0 0 10px; font-size:.98rem; font-weight:800; color:#6d28d9;}
  label{font-size:.72rem; color:var(--muted); display:block; margin:6px 0 3px;}
  input[type=text], input[type=url]{
    width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:12px;
    font-size:.88rem; background:#fbfaff; outline:none;
  }
  input:focus{border-color:var(--purple);}
  .sessions-pick{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px;}
  .sessions-pick label{
    display:flex; align-items:center; gap:4px; background:#f6f0ff; padding:6px 10px;
    border-radius:20px; font-size:.78rem; margin:0; cursor:pointer; border:1.5px solid transparent;
  }
  .sessions-pick input{margin:0;}
  .sessions-pick label:has(input:checked){border-color:var(--purple); background:#ede4ff;}

  button.primary{
    width:100%; background:linear-gradient(90deg,var(--pink),var(--purple)); color:#fff;
    border:none; padding:12px; border-radius:14px; font-size:.92rem; font-weight:800;
    cursor:pointer; margin-top:4px;
  }
  button.primary:active{transform:scale(.98);}

  .songs{display:flex; flex-direction:column; gap:16px;}
  .song-card{
    background:#fff; border:2px solid var(--border); border-radius:20px; padding:14px;
    position:relative; transition:.25s;
  }
  .song-card.complete{
    border:3px solid transparent;
    background-image:linear-gradient(#fff,#fff),
      linear-gradient(120deg,#ff8fab,#ffd36e,#8affc1,#6ec9ff,#c68fff);
    background-origin:border-box; background-clip:padding-box, border-box;
    animation:rainbow-shift 5s linear infinite; background-size:100% 100%,300% 300%;
    box-shadow:0 6px 16px rgba(0,0,0,.08);
  }
  @keyframes rainbow-shift{
    0%{background-position:0 0,0% 50%;} 100%{background-position:0 0,100% 50%;}
  }
  .thumb-wrap{position:relative; width:100%; border-radius:14px; overflow:hidden; margin-bottom:10px; display:block;}
  .thumb-wrap img{width:100%; display:block; aspect-ratio:16/9; object-fit:cover;}
  .thumb-wrap .play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.15);
  }
  .thumb-wrap .play span{
    background:rgba(0,0,0,.55); color:#fff; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  }
  .song-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .song-title{font-size:1rem; font-weight:800;}
  .meta{font-size:.74rem; color:var(--muted); margin-top:2px; line-height:1.5;}
  .badge-complete{
    background:linear-gradient(90deg,#22c55e,#4ade80); color:#fff; font-size:.68rem;
    padding:4px 10px; border-radius:20px; font-weight:800; white-space:nowrap;
  }
  .del-btn{background:none; border:none; color:#d7d2e0; cursor:pointer; font-size:.95rem; padding:2px;}
  .del-btn:active{color:#f87171;}

  .sess-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
  .sess-item{
    background:#faf9fd; border:1px solid var(--border); border-radius:14px; padding:8px;
    display:flex; align-items:center; gap:8px;
  }
  .sess-circle{
    width:38px; height:38px; min-width:38px; border-radius:50%; background:#eceef3;
    border:3px solid #d8dbe4; display:flex; align-items:center; justify-content:center;
    font-size:1.05rem; position:relative;
  }
  .sess-circle.stat-green{background:#dcfce7; border-color:#22c55e;}
  .sess-circle.stat-red{background:#fee2e2; border-color:#f87171;}
  .sess-circle.stat-x{background:#f3f4f6; border-color:#9ca3af;}
  .sess-circle .x-badge{
    position:absolute; top:-4px; right:-4px; background:#6b7280; color:#fff;
    font-size:.55rem; width:14px; height:14px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-weight:900;
  }
  .sess-mid{flex:1; min-width:0;}
  .sess-name{font-size:.72rem; font-weight:700; margin-bottom:3px;}
  .sess-actions{display:flex; gap:3px;}
  .sess-actions button{
    flex:1; border:none; border-radius:8px; padding:4px 0; font-size:.72rem;
    background:#eceef3; cursor:pointer; line-height:1.4;
  }
  .sess-actions button.on-green{background:#22c55e; color:#fff;}
  .sess-actions button.on-red{background:#f87171; color:#fff;}
  .sess-actions button.on-x{background:#6b7280; color:#fff;}

  .participants{
    margin-top:12px; padding-top:10px; border-top:1px dashed var(--border); font-size:.78rem;
  }
  .participants .p-title{font-weight:800; color:#16a34a; margin-bottom:4px;}
  .participants .p-row{margin-bottom:2px;}
  .my-tag{
    display:inline-block; margin-left:4px; font-size:.6rem; background:#fef08a; color:#854d0e;
    padding:1px 5px; border-radius:8px; font-weight:700;
  }
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:.85rem;}

  .overlay{
    position:fixed; inset:0; background:rgba(30,20,50,.55); display:none;
    align-items:center; justify-content:center; z-index:999; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff; border-radius:22px; padding:24px 22px; text-align:center; max-width:340px;
    width:100%; animation:pop .3s ease; max-height:85vh; overflow-y:auto;
  }
  @keyframes pop{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal h3{margin:6px 0; font-size:1.15rem;}
  .modal p{color:var(--muted); font-size:.82rem;}
  .modal input[type=text]{margin-bottom:8px;}
  .modal .grp-pick{display:flex; gap:6px; margin:8px 0 4px;}
  .modal .grp-pick button{
    flex:1; padding:9px; border-radius:12px; border:1.5px solid var(--border);
    background:#faf9fd; font-size:.8rem; cursor:pointer; font-weight:700;
  }
  .modal .grp-pick button.sel{background:var(--purple); color:#fff; border-color:var(--purple);}
  .modal .sessions-pick{justify-content:center;}
  .modal button.confirm{
    margin-top:14px; width:100%; background:linear-gradient(90deg,var(--pink),var(--purple));
    color:#fff; border:none; padding:11px; border-radius:14px; cursor:pointer; font-weight:800;
    font-size:.9rem;
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="phone-inner">

    <h1>🎸 합주곡 추천</h1>
    <div class="sub">세션에 스티커 붙이고, 다 모이면 무지개가 떠요 🌈</div>

    <div class="profile-bar">
      <div class="who" id="whoAmI">-</div>
      <div style="display:flex;gap:6px;">
        <button id="adminBtn" onclick="openAdminModal()">🔐 관리자</button>
        <button onclick="openProfileModal(false)">내 정보 수정</button>
      </div>
    </div>
    <div id="syncStatus" style="text-align:center;font-size:.72rem;color:var(--muted);margin:-8px 0 12px;"></div>

    <div class="form-card">
      <h2>➕ 곡 추천하기</h2>
      <label>곡 제목</label>
      <input type="text" id="titleInput" placeholder="예: Rolling in the Deep">
      <label>유튜브 링크</label>
      <input type="url" id="linkInput" placeholder="https://youtube.com/watch?v=...">
      <label>원하는 보컬 (선택)</label>
      <input type="text" id="vocalInput" placeholder="자유롭게 적어주세요">
      <label>비고 (선택)</label>
      <input type="text" id="noteInput" placeholder="예: 키 낮춰서 편곡 필요">
      <label>필요한 세션</label>
      <div class="sessions-pick" id="sessionsPick"></div>
      <button class="primary" onclick="addSong()">곡 등록하기</button>
    </div>

    <div class="songs" id="songList"></div>

  </div>
</div>

<div class="overlay" id="celebOverlay">
  <div class="modal">
    <div style="font-size:2.2rem;">🌈🎉</div>
    <h3 id="celebTitle"></h3>
    <p>모든 세션이 다 모였어요! 이 곡, 이제 합주 가능합니다.</p>
    <button class="confirm" onclick="closeCelebModal()">신난다!</button>
  </div>
</div>

<div class="overlay" id="profileOverlay">
  <div class="modal">
    <div style="font-size:2rem;">👋</div>
    <h3>반가워요!</h3>
    <p>이름과 조를 알려주시면 자동으로 기억할게요.</p>
    <label style="text-align:left;">이름</label>
    <input type="text" id="pfName" placeholder="이름 입력">
    <label style="text-align:left;">내 조</label>
    <div class="grp-pick" id="pfGroupPick"></div>
    <label style="text-align:left;">주로 맡는 세션 (선택)</label>
    <div class="sessions-pick" id="pfSessionsPick"></div>
    <button class="confirm" onclick="saveProfile()">시작하기</button>
  </div>
</div>

<div class="overlay" id="adminOverlay">
  <div class="modal">
    <div style="font-size:2rem;">🔐</div>
    <h3 id="adminModalTitle">관리자 로그인</h3>
    <p>다 모이기 전까지는 누가 신청했는지 관리자만 볼 수 있어요.</p>
    <div id="adminLoginForm">
      <label style="text-align:left;">아이디</label>
      <input type="text" id="adminId" placeholder="아이디" autocomplete="off">
      <label style="text-align:left;">비밀번호</label>
      <input type="password" id="adminPw" placeholder="비밀번호" autocomplete="off">
      <button class="confirm" onclick="loginAdmin()">로그인</button>
    </div>
    <div id="adminLoggedInBox" style="display:none;">
      <p style="color:#16a34a;font-weight:700;">✅ 관리자로 로그인되어 있어요.</p>
      <button class="confirm" style="background:linear-gradient(90deg,#9ca3af,#6b7280);" onclick="logoutAdmin()">로그아웃</button>
    </div>
    <button class="confirm" style="background:#f3e8ff;color:#7c3aed;margin-top:8px;" onclick="closeAdminModal()">닫기</button>
  </div>
</div>

<script type="module">
// ---------- Firebase 초기화 ----------
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8IzCTClpypc_Ja9I6mrLYCZ4tZlrY2oA",
  authDomain: "band-98897.firebaseapp.com",
  projectId: "band-98897",
  storageBucket: "band-98897.firebasestorage.app",
  messagingSenderId: "24639105658",
  appId: "1:24639105658:web:1f4fad627c81152e47a9c3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
// 모든 사용자가 공유하는 문서 하나에 곡 목록 전체를 저장합니다.
const songsDocRef = doc(db, "band", "songs");

const SESSION_TYPES = ['보컬','기타1','기타2','베이스','키보드1','키보드2','드럼'];
const EMOJI = {'보컬':'🎤','기타1':'🎸','기타2':'🎸','베이스':'🎸','키보드1':'🎹','키보드2':'🎹','드럼':'🥁'};
const SONGS_KEY = 'songs-list';
const GROUPS = ['1조','2조','스탭/기타'];

let songs = [];
let profile = null; // {name, group, mySessions:[]}

// ---------- admin (누가 신청했는지는 관리자만 볼 수 있음) ----------
const ADMIN_ID = 'admin';
const ADMIN_PW = 'admin123';
let isAdmin = false;

function loadAdminLocal(){
  try{ return sessionStorage.getItem('bandAdmin') === 'yes'; }catch(e){ return false; }
}
function saveAdminLocal(val){
  try{
    if(val) sessionStorage.setItem('bandAdmin','yes');
    else sessionStorage.removeItem('bandAdmin');
  }catch(e){}
}

function updateAdminBtn(){
  const btn = document.getElementById('adminBtn');
  if(!btn) return;
  btn.textContent = isAdmin ? '🔓 관리자 모드' : '🔐 관리자';
  btn.style.background = isAdmin ? '#dcfce7' : '';
  btn.style.color = isAdmin ? '#16a34a' : '';
}

function openAdminModal(){
  document.getElementById('adminId').value = '';
  document.getElementById('adminPw').value = '';
  document.getElementById('adminLoginForm').style.display = isAdmin ? 'none' : 'block';
  document.getElementById('adminLoggedInBox').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('adminModalTitle').textContent = isAdmin ? '관리자 모드' : '관리자 로그인';
  document.getElementById('adminOverlay').classList.add('show');
}
function closeAdminModal(){
  document.getElementById('adminOverlay').classList.remove('show');
}
function loginAdmin(){
  const id = document.getElementById('adminId').value.trim();
  const pw = document.getElementById('adminPw').value;
  if(id===ADMIN_ID && pw===ADMIN_PW){
    isAdmin = true;
    saveAdminLocal(true);
    updateAdminBtn();
    closeAdminModal();
    render();
  } else {
    alert('아이디 또는 비밀번호가 올바르지 않아요.');
  }
}
function logoutAdmin(){
  isAdmin = false;
  saveAdminLocal(false);
  updateAdminBtn();
  closeAdminModal();
  render();
}

// ---------- init pickers ----------
function buildSessionPicker(containerId, prechecked){
  const div = document.getElementById(containerId);
  div.innerHTML='';
  SESSION_TYPES.forEach(s=>{
    const id = containerId+'_'+s;
    const lbl = document.createElement('label');
    const checked = prechecked===undefined || prechecked.includes(s) ? 'checked' : '';
    lbl.innerHTML = `<input type="checkbox" id="${id}" value="${s}" ${checked}> ${EMOJI[s]} ${s}`;
    div.appendChild(lbl);
  });
}
buildSessionPicker('sessionsPick');

function buildGroupPicker(){
  const div = document.getElementById('pfGroupPick');
  div.innerHTML='';
  GROUPS.forEach(g=>{
    const b = document.createElement('button');
    b.textContent = g;
    b.type='button';
    b.onclick = ()=>{
      [...div.children].forEach(c=>c.classList.remove('sel'));
      b.classList.add('sel');
    };
    b.dataset.group = g;
    div.appendChild(b);
  });
}
buildGroupPicker();

// ---------- profile ----------
function loadProfileLocal(){
  try{
    const raw = localStorage.getItem('bandProfile');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveProfileLocal(p){
  try{ localStorage.setItem('bandProfile', JSON.stringify(p)); }catch(e){}
}

function openProfileModal(){
  buildGroupPicker();
  buildSessionPicker('pfSessionsPick', profile ? profile.mySessions : []);
  document.getElementById('pfName').value = profile ? profile.name : '';
  if(profile){
    const btns = document.getElementById('pfGroupPick').children;
    [...btns].forEach(b=>{ if(b.dataset.group===profile.group){ b.classList.add('sel'); }});
  }
  document.getElementById('profileOverlay').classList.add('show');
}

function saveProfile(){
  const name = document.getElementById('pfName').value.trim();
  if(!name){ alert('이름을 입력해주세요!'); return; }
  const gDiv = document.getElementById('pfGroupPick');
  const selBtn = [...gDiv.children].find(b=>b.classList.contains('sel'));
  const group = selBtn ? selBtn.dataset.group : GROUPS[0];
  const mySessions = SESSION_TYPES.filter(s=>document.getElementById('pfSessionsPick_'+s).checked);
  profile = {name, group, mySessions};
  saveProfileLocal(profile);
  document.getElementById('profileOverlay').classList.remove('show');
  updateWhoAmI();
  render();
}

function updateWhoAmI(){
  document.getElementById('whoAmI').textContent = profile
    ? `${profile.name} · ${profile.group}` : '-';
}

// ---------- storage (Firebase Firestore, 실시간 공유) ----------
// 문서(band/songs)에 { list: songs } 형태로 저장하고,
// onSnapshot으로 실시간 구독해서 다른 사람이 등록/수정하면 자동으로 화면이 갱신됩니다.
let unsubscribeSongs = null;

function setSyncStatus(text, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.style.color = isError ? '#f87171' : 'var(--muted)';
}

function subscribeSongs(){
  if(unsubscribeSongs) unsubscribeSongs(); // 중복 구독 방지
  setSyncStatus('🔄 연결 중...', false);
  unsubscribeSongs = onSnapshot(songsDocRef, (snap)=>{
    if(snap.exists()){
      songs = snap.data().list || [];
    } else {
      songs = [];
    }
    try{ localStorage.setItem('songs-backup', JSON.stringify(songs)); }catch(e){}
    setSyncStatus('☁️ 실시간 동기화됨', false);
    render();
  }, (err)=>{
    console.error('Firestore 연결 실패', err);
    setSyncStatus('⚠️ 공유 저장소 연결 실패 - 이 기기에만 저장됩니다 (' + (err.code||err.message) + ')', true);
    try{
      const raw = localStorage.getItem('songs-backup');
      songs = raw ? JSON.parse(raw) : [];
    }catch(e){ songs = []; }
    render();
  });
}

async function saveSongs(){
  try{ localStorage.setItem('songs-backup', JSON.stringify(songs)); }catch(e){}
  try{
    await setDoc(songsDocRef, { list: songs, updatedAt: Date.now() });
    setSyncStatus('☁️ 실시간 동기화됨', false);
  }catch(e){
    console.error('Firestore 저장 실패', e);
    setSyncStatus('⚠️ 저장 실패! 다른 사람에게 안 보여요 (' + (e.code||e.message) + ')', true);
    alert('⚠️ 공유 저장소 저장에 실패했어요.\n이 기기에만 저장되고 다른 사람에게는 보이지 않습니다.\n관리자에게 파이어베이스 설정 확인을 요청하세요.\n\n오류: ' + (e.code||e.message));
  }
}

// ---------- youtube helpers ----------
function getYoutubeId(url){
  if(!url) return null;
  const patterns = [
    /youtube\.com\/watch\?v=([\w-]{11})/,
    /youtu\.be\/([\w-]{11})/,
    /youtube\.com\/shorts\/([\w-]{11})/,
    /youtube\.com\/embed\/([\w-]{11})/
  ];
  for(const p of patterns){ const m=url.match(p); if(m) return m[1]; }
  return null;
}
function normalizeUrl(url){
  if(!url) return null;
  let u = url.trim();
  if(!u) return null;
  if(!/^https?:\/\//i.test(u)) u = 'https://'+u;
  return u;
}

// ---------- song CRUD ----------
async function addSong(){
  const title = document.getElementById('titleInput').value.trim();
  const linkRaw = document.getElementById('linkInput').value.trim();
  const vocal = document.getElementById('vocalInput').value.trim();
  const note = document.getElementById('noteInput').value.trim();
  if(!title){ alert('곡 제목을 입력해주세요!'); return; }

  const needed = SESSION_TYPES.filter(s=>document.getElementById('sessionsPick_'+s).checked);
  if(needed.length===0){ alert('필요한 세션을 하나 이상 선택해주세요!'); return; }

  const claims = {};
  needed.forEach(s=>claims[s]={});

  const song = {
    id: 'song_'+Date.now()+'_'+Math.floor(Math.random()*1000),
    title, link: normalizeUrl(linkRaw), vocal, note,
    neededSessions: needed,
    claims,
    celebrated:false,
    createdAt: Date.now()
  };
  songs.unshift(song);
  await saveSongs();
  document.getElementById('titleInput').value='';
  document.getElementById('linkInput').value='';
  document.getElementById('vocalInput').value='';
  document.getElementById('noteInput').value='';
  render();
}

async function deleteSong(id){
  if(!confirm('이 곡을 목록에서 삭제할까요?')) return;
  songs = songs.filter(s=>s.id!==id);
  await saveSongs();
  render();
}

function sessionAggregateStatus(claimMap){
  const vals = Object.values(claimMap||{});
  if(vals.includes('green')) return 'green';
  if(vals.includes('red')) return 'red';
  if(vals.length>0) return 'x';
  return 'none';
}
function isComplete(song){
  return song.neededSessions.every(s=>{
    const st = sessionAggregateStatus(song.claims[s]);
    return st==='green' || st==='red';
  });
}

async function setStatus(songId, session, status){
  if(!profile){ openProfileModal(); return; }
  const song = songs.find(s=>s.id===songId);
  if(!song) return;
  if(!song.claims[session]) song.claims[session]={};
  const cur = song.claims[session][profile.name];
  if(cur===status){
    delete song.claims[session][profile.name]; // toggle off
  } else {
    song.claims[session][profile.name]=status;
  }
  const wasComplete = song.celebrated;
  await saveSongs();
  render();
  if(isComplete(song) && !wasComplete){
    song.celebrated = true;
    await saveSongs();
    showCelebModal(song.title);
    render();
  }
}

function showCelebModal(title){
  document.getElementById('celebTitle').textContent = `"${title}" 합주 가능!`;
  document.getElementById('celebOverlay').classList.add('show');
}
function closeCelebModal(){
  document.getElementById('celebOverlay').classList.remove('show');
}

// ---------- render ----------
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  updateWhoAmI();
  const list = document.getElementById('songList');
  list.innerHTML='';
  if(songs.length===0){
    list.innerHTML = '<div class="empty">아직 추천된 곡이 없어요.<br>위에서 첫 곡을 추천해보세요! 🎶</div>';
    return;
  }
  songs.forEach(song=>{
    const complete = isComplete(song);
    const vid = getYoutubeId(song.link);
    const card = document.createElement('div');
    card.className = 'song-card' + (complete ? ' complete' : '');

    let thumbHtml = '';
    if(vid){
      const watchUrl = `https://www.youtube.com/watch?v=${vid}`;
      thumbHtml = `
        <a class="thumb-wrap" href="${watchUrl}" target="_blank" rel="noopener">
          <img src="https://img.youtube.com/vi/${vid}/mqdefault.jpg" alt="thumbnail">
          <div class="play"><span>▶</span></div>
        </a>`;
    } else if(song.link){
      thumbHtml = `<a href="${song.link}" target="_blank" rel="noopener" style="font-size:.75rem;color:#7c3aed;">🔗 링크로 듣기</a>`;
    }

    let metaParts = [];
    if(song.vocal) metaParts.push(`🎤 희망 보컬: ${escapeHtml(song.vocal)}`);
    if(song.note) metaParts.push(`📝 ${escapeHtml(song.note)}`);

    card.innerHTML = `
      ${thumbHtml}
      <div class="song-top">
        <div>
          <div class="song-title">${escapeHtml(song.title)}</div>
          ${metaParts.length ? `<div class="meta">${metaParts.join('<br>')}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          ${complete ? `<span class="badge-complete">✅ 가능!</span>` : ''}
          <button class="del-btn" onclick="deleteSong('${song.id}')">✕</button>
        </div>
      </div>
      <div class="sess-grid" id="sess_${song.id}"></div>
      ${isAdmin ? `<div class="participants" id="part_${song.id}"></div>` : ''}
    `;
    list.appendChild(card);

    const sessDiv = card.querySelector(`#sess_${song.id}`);
    song.neededSessions.forEach(s=>{
      const claimMap = song.claims[s]||{};
      const agg = sessionAggregateStatus(claimMap);
      const myStatus = profile ? claimMap[profile.name] : undefined;
      const item = document.createElement('div');
      item.className = 'sess-item';
      item.innerHTML = `
        <div class="sess-circle ${agg!=='none' ? 'stat-'+agg : ''}">
          ${EMOJI[s]}
          ${agg==='x' ? '<span class="x-badge">✕</span>' : ''}
        </div>
        <div class="sess-mid">
          <div class="sess-name">${s}</div>
          <div class="sess-actions">
            <button class="${myStatus==='green'?'on-green':''}" title="가능해요" onclick="setStatus('${song.id}','${s}','green')">👍</button>
            <button class="${myStatus==='red'?'on-red':''}" title="하고싶어요" onclick="setStatus('${song.id}','${s}','red')">🙋</button>
            <button class="${myStatus==='x'?'on-x':''}" title="너무 어려워요" onclick="setStatus('${song.id}','${s}','x')">🙅</button>
          </div>
        </div>
      `;
      sessDiv.appendChild(item);
    });

    if(isAdmin){
      const partDiv = card.querySelector(`#part_${song.id}`);
      let html = `<div class="p-title">${complete ? '🎊 참여 확정 멤버' : '🔍 현재 신청 현황 (관리자 전용)'}</div>`;
      song.neededSessions.forEach(s=>{
        const claimMap = song.claims[s]||{};
        const entries = Object.entries(claimMap);
        const names = entries.length
          ? entries.map(([n,st])=>{
              const icon = st==='green' ? '👍' : st==='red' ? '🙋' : '🙅';
              return `${escapeHtml(n)}${icon}`;
            }).join(', ')
          : '<span style="color:var(--gray);">아직 없음</span>';
        html += `<div class="p-row">${EMOJI[s]} ${s}: ${names}</div>`;
      });
      partDiv.innerHTML = html;
    }
  });
}

// ---------- boot ----------
window.addEventListener('DOMContentLoaded', ()=>{
  profile = loadProfileLocal();
  if(!profile){
    openProfileModal();
  } else {
    updateWhoAmI();
  }
  isAdmin = loadAdminLocal();
  updateAdminBtn();
  subscribeSongs(); // Firestore 실시간 구독 시작
});

// type="module" 스크립트는 함수가 자동으로 전역(window)에 노출되지 않으므로
// HTML의 onclick="..." 에서 호출할 수 있도록 명시적으로 등록합니다.
window.openProfileModal = openProfileModal;
window.saveProfile = saveProfile;
window.addSong = addSong;
window.deleteSong = deleteSong;
window.setStatus = setStatus;
window.closeCelebModal = closeCelebModal;
window.openAdminModal = openAdminModal;
window.closeAdminModal = closeAdminModal;
window.loginAdmin = loginAdmin;
window.logoutAdmin = logoutAdmin;
</script>
</body>
</html>
